const cur=r=>{const m=r.meta;return A(m.bonus)[0]||m.order[snake(m.order.length,m.idx,m.rev)]};
const TS=r=>r.meta.team||4;
const pw=c=>Math.round((c.atk*1.15+c.def+c.spd*.85)*(RM[c.rarity]||1)/3);
function pairs(ids,round){const a=[...ids];if(a.length<2)return[];if(a.length%2)a.push(null);
 const m=a.length,r=((round||1)-1)%(m-1);let rest=a.slice(1);const cut=(m-1-r)%(m-1);
 rest=[...rest.slice(cut),...rest.slice(0,cut)];const L=[a[0],...rest],out=[];
 for(let i=0;i<m/2;i++){const x=L[i],y=L[m-1-i];if(x&&y)out.push([x,y])}return out}
function mk(c){const g=rng(hash(c.name)),x=g(),st=()=>45+(g()*56|0);
 return{name:c.name,img:c.img,anime:c.anime||'',atk:st(),def:st(),spd:st(),role:ROLE[g()*3|0],element:EL[g()*5|0],rarity:x<.09?'SSR':x<.32?'SR':'R',takenBy:''}}

function tmb(r,pid){const p=r.players[pid]||{};return T(p).map(id=>{const c=r.pool&&r.pool[id];if(!c)return null;
 const b=(p.bonus||{})[id]||{},cap=p.captain==id,k=(RM[c.rarity]||1)*(1+.08*(b.p||0))*(cap?1.18:1),RO=ROF[c.role]||[1,1,1,1];
 const at=(c.atk+(b.a||0))*k*RO[0],df=(c.def+(b.d||0))*k*RO[1],sp=(c.spd+(b.s||0))*k*RO[2];
 return{id,name:c.name,img:c.img,anime:c.anime,role:c.role,element:c.element,rarity:c.rarity,cap,
  atk:Math.round(at),def:Math.round(df),spd:Math.round(sp),
  hp:Math.round((190+df*5.4)*RO[3]*(1+.15*(b.h||0))*(cap?1.15:1)),uc:(b.u||0)*.8}}).filter(Boolean)}

function syn(t){const o={atk:1,all:1,hp:1,n:[]},cnt=f=>{const m={};t.forEach(c=>c[f]&&(m[c[f]]=(m[c[f]]||0)+1));return m};
 let pr=0;Object.values(cnt('element')).forEach(v=>pr+=v*(v-1)/2);
 if(pr){o.atk*=1+.08*pr;o.n.push(`ธาตุซ้ำ ${pr} คู่ · ATK +${pr*8}%`)}
 if(t.length>=3&&new Set(t.map(c=>c.role)).size==3){o.all+=.12;o.n.push('ครบ Tank/Damage/Support · พลังรวม +12%')}
 const dup=Object.entries(cnt('anime')).filter(([,v])=>v>1);
 if(dup.length){const x=dup.reduce((s,[,v])=>s+v,0);o.all+=.06*x;o.n.push(`เพื่อนร่วมเรื่อง (${dup.map(d=>d[0]).join(', ')}) · พลังรวม +${x*6}%`)}
 if(t.filter(c=>c.role=='Tank').length>=2){o.hp+=.15;o.n.push('แนวหน้าแกร่ง · HP +15%')}
 if(t.filter(c=>c.role=='Support').length>=2){o.all+=.08;o.n.push('ซัพพอร์ตคู่ · พลังรวม +8%')}
 if(t.filter(c=>c.rarity=='SSR').length>=2){o.atk*=1.1;o.n.push('ทีมดาวเด่น SSR · ATK +10%')}
 if(new Set(t.map(c=>c.element)).size>=5){o.all+=.2;o.n.push('ครบ 5 ธาตุ · พลังรวม +20%')}
 return o}

function adv(r,bn){const m=r.meta,n=m.order.length,ts=TS(r),full=id=>T(r.players[id]).length>=ts;m.bonus=A(m.bonus);
 if(bn)m.bonus=m.bonus.slice(1);else m.idx++;
 const rb=!bn&&m.idx%n==0&&m.idx<ts*n;m.seq=(m.seq||0)+1;m.bonus=m.bonus.filter(id=>!full(id));
 while(!m.bonus.length&&m.idx<ts*n&&full(m.order[snake(n,m.idx,m.rev)]))m.idx++;
 if(!m.bonus.length&&(m.idx>=ts*n||!avail(r).length))return toShop(r,1);
 if(rb&&Math.random()<.82)chaos(r);
 const sec=m.nextTime||m.dtime||30;m.ts=sv();m.dur=sec*1000;m.turnEndsAt=m.ts+m.dur;m.nextTime=0}

function chaos(r){const m=r.meta,n=m.order.length,[id,t0]=CH[rn(CH.length)];let t=t0;m.noEl=0;m.nextAtk=0;m.nextHp=0;m.bonus=A(m.bonus);
 if(id=='double')m.bonus.push(m.order[snake(n,m.idx,m.rev)]);
 if(id=='t10')m.nextTime=10;
 if(id=='atk')m.nextAtk=20;
 if(id=='bounty')m.nextHp=1;
 if(id=='noel'){m.noEl=EL[rn(5)];t=`🚫 รอบนี้ห้ามเลือกธาตุ${m.noEl} ${EI[m.noEl]}`}
 if(id=='rich')Object.values(r.players).forEach(p=>p.coins=(p.coins||0)+70);
 if(id=='reset')Object.values(r.players).forEach(p=>p.stealUsed=false);
 if(id=='reverse')m.rev=m.rev?0:1;
 if(id=='rare')Object.entries(r.pool).forEach(([,c])=>{if(!c.takenBy&&c.rarity=='R'){c.atk+=12;c.def+=12;c.spd+=12}});
 if(id=='swap'){const ids=m.order.filter(i=>T(r.players[i]).length);
  if(ids.length>1){const a=ids.splice(rn(ids.length),1)[0],b=ids[rn(ids.length)];
   const x=r.players[a],y=r.players[b],tx=T(x),ty=T(y),i=rn(tx.length),j=rn(ty.length),c1=tx[i],c2=ty[j];
   tx[i]=c2;ty[j]=c1;x.team=tx;y.team=ty;r.pool[c1].takenBy=b;r.pool[c2].takenBy=a}}
 r.chaosCard={id,text:t,seq:Date.now()}}

function take(r,pid,cid){const m=r.meta,p=r.players[pid],c=r.pool[cid],bn=A(m.bonus).length>0;
 if(m.phase!='draft'||cur(r)!=pid||!c||c.takenBy||T(p).length>=TS(r)||(m.noEl&&c.element==m.noEl))return false;
 c.takenBy=pid;p.team=[...T(p),cid];
 if(m.nextAtk||m.nextHp){p.bonus=p.bonus||{};const b=p.bonus[cid]=p.bonus[cid]||{a:0,d:0,s:0,p:0,h:0,u:0};
  b.a+=m.nextAtk||0;b.h+=m.nextHp||0;m.nextAtk=0;m.nextHp=0}
 r.lastPick={by:pid,name:c.name,seq:Date.now()};adv(r,bn)}

function steal(r,pid,cid){const m=r.meta,p=r.players[pid],c=r.pool[cid],v=c&&c.takenBy,bn=A(m.bonus).length>0;
 if(m.phase!='draft'||cur(r)!=pid||p.stealUsed||!v||v==pid||v=='BAN'||!r.players[v]||T(p).length>=TS(r))return false;
 const V=r.players[v];V.team=T(V).filter(x=>x!=cid);c.takenBy=pid;p.team=[...T(p),cid];p.stealUsed=true;V.stolen=(V.stolen||0)+1;
 m.bonus=[...A(m.bonus),v];r.stealFx={by:pid,from:v,name:c.name,seq:Date.now()};adv(r,bn)}

function endBan(r){const m=r.meta;if(m.phase!='ban')return false;const av=avail(r),ids=new Set();
 Object.values(r.players).forEach(p=>{let b=p.ban;if(!b||!r.pool[b]||r.pool[b].takenBy)b=av[rn(av.length)].id;ids.add(b);p.ban=null});
 r.banned=[...ids];ids.forEach(i=>r.pool[i]&&(r.pool[i].takenBy='BAN'));
 m.order=Object.keys(r.players).sort((a,b)=>r.players[a].joined-r.players[b].joined);
 Object.assign(m,{idx:0,bonus:[],seq:1,phase:'draft',ts:sv(),nextTime:0,noEl:0,nextAtk:0,nextHp:0,rev:0});
 m.dur=(m.dtime||30)*1000;m.turnEndsAt=m.ts+m.dur}

function toShop(r,round){const m=r.meta;m.phase='shop';m.round=round;
 Object.values(r.players).forEach(p=>{p.isReady=false;if(round==1)p.coins=(p.coins||0)+160;
  if(!p.captain||!T(p).includes(p.captain)){const t=tmb(r,Object.keys(r.players).find(k=>r.players[k]===p));p.captain=T(p)[0]||null}});
 m.dur=(round==1?50:38)*1000;m.turnEndsAt=sv()+m.dur}

const buy=(r,pid,cid,k)=>{const p=r.players[pid],it=ITEMS.find(i=>i[1]==k);
 if(r.meta.phase!='shop'||!it||(p.coins||0)<it[4]||!T(p).includes(cid))return false;
 p.coins-=it[4];p.bonus=p.bonus||{};const b=p.bonus[cid]=p.bonus[cid]||{a:0,d:0,s:0,p:0,h:0,u:0};b[k]=(b[k]||0)+it[2]};

/* -------- การต่อสู้ -------- */
function hit(X,Y,ult,g,ev){const eff=BEAT[X.element]==Y.element;let m=1;if(eff)m*=1.35;if(ult)m*=1.9;
 let d=(X.atk*1.5+X.spd*.5)*m*(.9+g()*.2)-Y.def*.6;const cr=g()<.12;if(cr)d*=1.6;
 d=Math.max(12,Math.round(d));const dg=!ult&&(ev||g()<.07+Math.max(0,Y.spd-X.spd)*.0022);
 return{d:dg?0:d,cr,dg,eff}}
const lnTx=(X,x,u)=>`${X.name}${X.cap?'👑':''}${u?` ⚡「${ULT[X.element]}」`:''} ▸ ${x.dg?'ถูกหลบ!':(x.cr?'คริติคอล! ':'')+(x.eff?EI[X.element]+'ธาตุข่ม! ':'')+'-'+x.d}`;

function fight(r,a,b,g,hy){
 const bui=id=>{const t=tmb(r,id),s=syn(t),hb=1+Math.min(.08,(hy[id]||0)*.012);
  t.forEach(c=>{c.atk=Math.round(c.atk*s.all*s.atk*hb);c.def=Math.round(c.def*s.all);c.spd=Math.round(c.spd*s.all);c.hp=Math.round(c.hp*s.all*s.hp*hb)});
  return{id,t,s,n:r.players[id].name}};
 const P=[bui(a),bui(b)],L=[],st=[{w:0,d:0,c:0,bd:0,bn:''},{w:0,d:0,c:0,bd:0,bn:''}];
 L.push({s:`⚔️ ${P[0].n}  VS  ${P[1].n}`,h:1,a,b});
 P.forEach(x=>x.s.n.forEach(t=>L.push({s:`✨ ${x.n}: ${t}`,a,b})));
 const N=Math.min(P[0].t.length,P[1].t.length);
 for(let i=0;i<N;i++){
  const C=[{...P[0].t[i]},{...P[1].t[i]}],hp=[C[0].hp,C[1].hp],u=[0,0],bn=[0,0],ev=[0,0];
  const put=(s,o)=>L.push(Object.assign({s,a,b,xi:C[0].id,yi:C[1].id,hx:Math.max(0,hp[0]),hy:Math.max(0,hp[1]),mx:C[0].hp,my:C[1].hp,sa:st[0].w,sb:st[1].w},o||{}));
  put(`🎌 ดวลที่ ${i+1} — ${C[0].name} ${EI[C[0].element]} ปะทะ ${C[1].name} ${EI[C[1].element]}`,{d:1});
  for(let t=0;t<5&&hp[0]>0&&hp[1]>0;t++){
   const tx=[],ord=C[0].spd>=C[1].spd?[0,1]:[1,0];let uc=0,uu=0;
   for(const k of ord){if(hp[0]<=0||hp[1]<=0)break;const o=1-k;
    u[k]+=1+(C[k].uc||0);const isU=u[k]>=3;if(isU)u[k]=0;
    const x=hit(C[k],C[o],isU,g,ev[o]);ev[o]=0;hp[o]-=x.d;st[k].d+=x.d;
    if(x.cr){st[k].c++;uc=1}if(isU)uu=1;if(x.d>st[k].bd){st[k].bd=x.d;st[k].bn=C[k].name}
    if(isU&&!x.dg){const e=C[k].element;
     if(e=='น้ำ')hp[k]=Math.min(C[k].hp,hp[k]+Math.round(C[k].hp*.22));
     if(e=='มืด')hp[k]=Math.min(C[k].hp,hp[k]+Math.round(x.d*.6));
     if(e=='ไฟ')bn[o]=Math.round(C[o].hp*.07);
     if(e=='ลม')ev[k]=1;
     if(e=='สายฟ้า'){const y=hit(C[k],C[o],0,g,0);hp[o]-=y.d;st[k].d+=y.d;x.d+=y.d}}
    tx.push(lnTx(C[k],x,isU))}
   [0,1].forEach(k=>{if(bn[k]&&hp[k]>0){hp[k]-=bn[k];tx.push(`🔥 ${C[k].name} โดนไฟคลอก -${bn[k]}`)}});
   put(tx.join('   ⚡   '),{u:uu,c:uc})}
  let w=hp[0]<=0&&hp[1]>0?1:hp[1]<=0&&hp[0]>0?0:(hp[0]/C[0].hp>=hp[1]/C[1].hp?0:1);
  st[w].w++;put(`💥 ${C[w].name} คว้าชัยดวลที่ ${i+1}! · สกอร์ ${st[0].w}-${st[1].w}`,{k:1})}
 const win=st[0].w!=st[1].w?(st[0].w>st[1].w?0:1):(st[0].d>=st[1].d?0:1);
 L.push({s:`🏆 ${P[win].n} ชนะแมตช์! (${st[0].w}-${st[1].w} · ดาเมจ ${st[0].d}-${st[1].d})`,a,b,f:1});
 return{L,st,win,ids:[a,b]}}

function calc(r){const m=r.meta,ids=A(m.order).filter(i=>r.players[i]),g=rng(hash(m.createdAt+'|'+m.round)),L=[],hy={};
 r.results=r.results||{};A(r.hype).forEach(h=>{if(h&&h.to)hy[h.to]=(hy[h.to]||0)+1});r.hype=null;
 const Q=id=>r.results[id]=r.results[id]||{w:0,sc:0,cr:0,bd:0,bn:'',pts:0};
 const ps=pairs(ids,m.round),fo=new Set();
 ps.forEach(([a,b])=>{fo.add(a);fo.add(b);const o=fight(r,a,b,g,hy);L.push(...o.L);
  o.ids.forEach((id,k)=>{const q=Q(id),won=o.win==k;q.w+=won?1:0;q.sc+=o.st[k].d;q.cr+=o.st[k].c;q.pts+=o.st[k].w;
   if(o.st[k].bd>q.bd){q.bd=o.st[k].bd;q.bn=o.st[k].bn}
   r.players[id].coins=(r.players[id].coins||0)+(won?150:75)+Math.round(o.st[k].d/30)})});
 ids.filter(i=>!fo.has(i)).forEach(id=>{Q(id);L.push({s:`😴 ${r.players[id].name} ได้บายรอบนี้ (+130 เหรียญ)`,a:id,b:id});
  r.players[id].coins=(r.players[id].coins||0)+130});
 r.battleLog=L;m.lineMs=Math.max(360,Math.min(900,Math.round(48000/Math.max(1,L.length))));
 m.startAt=sv()+3000;m.endAt=m.startAt+L.length*m.lineMs+2600}

function endBattle(r){const m=r.meta;if(m.phase!='battle'||!r.battleLog||sv()<m.endAt)return false;r.battleLog=null;
 if(m.round>=(m.rounds||3)){m.phase='results';return}toShop(r,m.round+1)}

function botPick(r,pid){const m=r.meta,av=avail(r).filter(c=>!(m.noEl&&c.element==m.noEl));if(!av.length)return null;
 const t=T(r.players[pid]).map(i=>r.pool[i]).filter(Boolean),roles=new Set(t.map(x=>x.role)),els=t.map(x=>x.element),ans=t.map(x=>x.anime).filter(Boolean);
 const sc=c=>{let s=pw(c);if(!roles.has(c.role)&&t.length<3)s+=14;if(els.includes(c.element))s+=11;
  if(c.anime&&ans.includes(c.anime))s+=22;return s+rn(12)};
 return av.sort((x,y)=>sc(y)-sc(x))[0].id}
function botSteal(r,pid){const p=r.players[pid];if(p.stealUsed||Math.random()<.78)return false;
 const t=Object.entries(r.pool).filter(([,c])=>c.takenBy&&c.takenBy!=pid&&c.takenBy!='BAN'&&r.players[c.takenBy]&&c.rarity=='SSR');
 if(!t.length)return false;return steal(r,pid,t[rn(t.length)][0])!==false}
function botShop(r,pid){const p=r.players[pid],ts=T(p);if(!ts.length)return;
 const tb=tmb(r,pid);tb.sort((a,b)=>(b.atk+b.def+b.spd)-(a.atk+a.def+a.spd));
 p.team=tb.map(c=>c.id);p.captain=tb[0].id;
 let guard=0;while(guard++<8){const af=ITEMS.filter(i=>(p.coins||0)>=i[4]);if(!af.length)break;
  const it=af[rn(af.length)];buy(r,pid,p.team[rn(p.team.length)],it[1])}}

const shortT=t=>String(t||'').split(/[:：]/)[0].trim().slice(0,22);
function verify(list,cb){let done=0;const tot=list.length;
 return Promise.all(list.map(c=>new Promise(res=>{
  if(!c.img||c.img.startsWith('data:'))return res({...c,img:c.img||ph(c.name)});
  const im=new Image();im.referrerPolicy='no-referrer';
  const t=setTimeout(()=>{im.src='';res({...c,img:ph(c.name)})},6500);
  im.onload=()=>{clearTimeout(t);res(im.naturalWidth>10?c:{...c,img:ph(c.name)})};
  im.onerror=()=>{clearTimeout(t);res({...c,img:ph(c.name)})};im.src=c.img;
 }).then(v=>{done++;cb&&cb(`ตรวจสอบรูปภาพ ${done}/${tot}`,78+done/tot*22);return v})))}
async function load(cb){const out=[],J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
 try{cb('ดึงรายชื่ออนิเมะยอดนิยม...',4);
  const an=(await J('https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=25&sfw=true')).data.filter(d=>d.mal_id);
  const pick=shuf(an).slice(0,12);await sleep(380);
  for(let i=0;i<pick.length;i++){cb(`โหลดตัวละครจาก ${shortT(pick[i].title)} (${i+1}/${pick.length})`,8+i/pick.length*62);
   try{const cs=(await J(`https://api.jikan.moe/v4/anime/${pick[i].mal_id}/characters`)).data
     .sort((x,y)=>(y.favorites||0)-(x.favorites||0)).slice(0,8);
    cs.forEach(c=>c.character&&out.push({id:'c'+c.character.mal_id,name:c.character.name,img:c.character.images?.jpg?.image_url,anime:shortT(pick[i].title)}))}catch(e){}
   await sleep(370)}}catch(e){}
 if(out.length<40){try{cb('โหลดตัวละครยอดนิยม...',70);
  for(let p=1;p<=2;p++){const j=await J(`https://api.jikan.moe/v4/characters?page=${p}&limit=25&order_by=favorites&sort=desc`);
   j.data.forEach(d=>out.push({id:'c'+d.mal_id,name:d.name,img:d.images?.jpg?.image_url,anime:''}));await sleep(420)}}catch(e){}}
 const sn=new Set();let list=out.filter(c=>c.name&&!sn.has(c.name)&&sn.add(c.name));
 if(list.length<40){cb('ใช้ชุดตัวละครสำรอง...',75);
  list=FALL.map(s=>{const[n,a]=s.split('|');return{id:'f'+hash(n),name:n,img:ph(n),anime:a}})}
 return verify(list,cb)}

async function tick(){if(!R||!code||busy)return;const m=R.meta,ps=R.players,now=sv(),
 on=id=>ps[id]&&(ps[id].isOnline||ps[id].isBot),hs=Object.keys(ps).sort((a,b)=>ps[a].joined-ps[b].joined),
 hum=hs.filter(id=>!ps[id].isBot&&ps[id].isOnline);
 if(!(ps[m.hostId]&&ps[m.hostId].isOnline&&!ps[m.hostId].isBot)){
  if(hum[0]===me){await act(r=>{const h=r.players[r.meta.hostId];if(h&&h.isOnline&&!h.isBot)return false;r.meta.hostId=me});toast('คุณเป็นโฮสต์คนใหม่แล้ว')}return}
 if(m.hostId!==me)return;busy=1;
 try{const ph2=m.phase;
  if(ph2=='ban'){if(hum.every(id=>ps[id].ban)||now>m.turnEndsAt)await act(endBan)}
  else if(ph2=='draft'){const c=cur(R),bot=ps[c]&&ps[c].isBot,sq=m.seq;
   if((bot&&now>m.ts+1700)||now>m.turnEndsAt||(!bot&&!on(c)&&now>m.ts+2500)){
    await act(r=>{if(r.meta.seq!==sq||r.meta.phase!='draft')return false;const id=cur(r);if(!r.players[id])return false;
     if(r.players[id].isBot&&botSteal(r,id))return;
     const p2=botPick(r,id);if(!p2)return false;return take(r,id,p2)})}}
  else if(ph2=='battle'){if(!R.battleLog)await act(r=>{if(r.meta.phase!='battle'||r.battleLog)return false;calc(r)});
   else if(now>m.endAt)await act(endBattle)}
  else if(ph2=='shop'){
   if(hs.some(id=>ps[id].isBot&&!ps[id].isReady)&&now>m.turnEndsAt-22000)
    await act(r=>{if(r.meta.phase!='shop')return false;let ch=0;
     Object.keys(r.players).forEach(id=>{const p=r.players[id];if(!p.isBot||p.isReady)return;botShop(r,id);p.isReady=true;ch=1});if(!ch)return false});
   if(hs.filter(on).every(id=>ps[id].isReady)||now>m.turnEndsAt)

 `<div class="top ${c==me?'mine':''}"><div><b>${c==me?'🔥 ถึงตาคุณแล้ว!':'เทิร์นของ '+(ps[c]?.isBot?'🤖 ':'')+E(ps[c]?.name)}</b>${stl?' · แตะตัวละครของคนอื่นเพื่อขโมย':''} · <b class=t data-end=${m.turnEndsAt} data-beep=1></b></div>
  <div class=tb><i data-bar data-end=${m.turnEndsAt} data-dur=${m.dur||30000}></i></div>
  <div class=pg><i style="width:${done/(ts*n)*100}%"></i></div>
  <small>ดราฟต์ ${done}/${ts*n} · รอบ ${Math.min(ts,Math.floor(m.idx/n)+1)}/${ts}${m.rev?' · ↩️ ลำดับกลับทาง':''}${m.noEl?' · 🚫 ห้ามธาตุ'+m.noEl:''}${m.nextAtk?' · 💪 ตัวนี้ได้ ATK+'+m.nextAtk:''}${m.nextHp?' · 🎯 ตัวนี้ได้ HP+15%':''}</small></div>`)
 +`<div class=leg>ธาตุข่มกัน: 🔥>🌪️>🌑>💧>⚡>🔥 (+35%)</div>`
 +(bn.length?`<div class="leg">🚫 ถูกแบน: ${bn.map(E).join(', ')}</div>`:'');
 $('#tm').innerHTML=ban?'':ord.map(id=>{const tt=tmb(R,id),tp=tt.reduce((s,x)=>s+pw(x),0);
  return`<div class="tmr ${id==c?'now':''} ${id==me?'me':''}"><b>${ps[id].isBot?'🤖':''}${E(ps[id].name)}</b>${ps[id].isOnline||ps[id].isBot?'':' ⚫'}${ps[id].stealUsed?' 🦹':''}
  <small> · ⚡${tp}</small><div class=st>${[...Array(TS(R))].map((_,i)=>{const t=T(ps[id])[i];
   return t?IMG(R.pool[t].img,R.pool[t].name,'',stl&&id!=me?`data-a=stt data-id=${t}`:''):'<span class=em></span>'}).join('')}</div></div>`}).join('');
 $('#bar').innerHTML=ban?`<span>${my.ban?'แบนแล้ว: '+E(R.pool[my.ban]?.name)+' (เปลี่ยนได้)':'แตะการ์ดเพื่อเลือกตัวที่จะแบน'}</span><button data-a=bn ${sel?'':'disabled'}>🚫 แบนตัวนี้</button>`:
  c==me?`<span>${sel?E(R.pool[sel].name):'แตะการ์ดเพื่อเลือก'}</span><button data-a=pick ${sel?'':'disabled'}>✅ เลือก</button>${my.stealUsed?'':`<button class="${stl?'on':'g'}" data-a=stm>${stl?'ยกเลิก':'🦹 ขโมย'}</button>`}`:
  `<span>รอ ${E(ps[c]?.name)} เลือก...</span>`;
 if(!ban&&T(my).length){const s=syn(tmb(R,me));$('#hd').innerHTML+=`<div class=leg>✨ โบนัสทีมคุณ: ${s.n.length?s.n.map(E).join(' · '):'ยังไม่มี'}</div>`}
 grid()}

function grid(){const g=$('#gr');if(!g)return;const m=R.meta,q=F.q.toLowerCase();
 let L=avail(R).filter(c=>(!q||c.name.toLowerCase().includes(q)||(c.anime||'').toLowerCase().includes(q))&&(!F.el||c.element==F.el)&&(!F.ro||c.role==F.ro)&&(!F.ra||c.rarity==F.ra));
 const so=F.so;L.sort((a,b)=>so=='atk'?b.atk-a.atk:so=='spd'?b.spd-a.spd:so=='nm'?a.name.localeCompare(b.name):pw(b)-pw(a));
 g.innerHTML=L.slice(0,120).map(c=>`<div class="cd ${c.rarity} ${sel==c.id?'sel':''} ${m.phase=='draft'&&m.noEl&&c.element==m.noEl?'dim':''}" data-a=sel data-id="${c.id}">
 <span class=rb>${c.rarity}</span><span class=ei>${EI[c.element]}</span><span class=pwb>⚡${pw(c)}</span>
 ${IMG(c.img,c.name)}
 <div class=nb><b>${E(c.name)}</b><small>${c.role}${c.anime?' · '+E(c.anime):''}</small>
 <div class=bars><i style="width:${c.atk}%"></i><i class=d style="width:${c.def}%"></i><i class=s style="width:${c.spd}%"></i></div>
 <small>⚔${c.atk} 🛡${c.def} 💨${c.spd}</small></div></div>`).join('')||'<p class=m>ไม่พบตัวละครตามเงื่อนไข</p>';
 if(L.length>120)g.innerHTML+='<p class=m>แสดง 120 ใบแรก · ใช้ตัวกรองเพื่อหาเพิ่ม</p>'}

const HELP=`<div class="card hl"><h3>📖 วิธีเล่น</h3>
<p><b>1. เฟสแบน</b> — ทุกคนเลือกแบนตัวละคร 1 ตัวพร้อมกัน ตัวที่ถูกแบนจะหายจากสนาม</p>
<p><b>2. เฟสดราฟต์</b> — ผลัดกันเลือกแบบงูเลื้อย จบแต่ละรอบมีโอกาสเจอ <b>การ์ดป่วน</b> (ดราฟต์สองตัวรวด, ห้ามธาตุ, กลับลำดับ, สลับตัว ฯลฯ)</p>
<p><b>🦹 ขโมย</b> — ใช้ได้ <b>คนละ 1 ครั้งทั้งเกม</b> แย่งตัวจากคนอื่นได้เลย แต่เขาจะได้สิทธิ์เลือกชดเชยทันที</p>
<p><b>3. เตรียมทีม</b> — ซื้อไอเทม เลือกกัปตัน 👑 (+18% สเตตัส) และ <b>จัดลำดับตัวรบ</b> โดยเห็นทีมคู่แข่งล่วงหน้า</p>
<p><b>4. ดวล</b> — ตัวที่ 1 ปะทะตัวที่ 1 ไปเรื่อย ๆ มีหลอดเลือดจริง ใครล้มก่อนแพ้ดวลนั้น ชนะดวลมากกว่า = ชนะแมตช์</p>
<p><b>ธาตุข่มกัน</b> 🔥>🌪️>🌑>💧>⚡>🔥 ทำดาเมจ +35%</p>
<p><b>ท่าไม้ตาย</b> ชาร์จครบยิงอัตโนมัติ: 🔥ติดไหม้ · 💧ฟื้นเลือด · ⚡ตีซ้ำ · 🌪️หลบ · 🌑ดูดเลือด</p>
<p><b>บทบาท</b> Tank เลือดหนา/Damage ตีแรง/Support สมดุล — มีครบ 3 แบบได้โบนัสทีม</p>
<p><b>ซินเนอร์จี้</b> ธาตุซ้ำ, ตัวละครจากเรื่องเดียวกัน, ครบ 5 ธาตุ, SSR 2 ตัวขึ้นไป ฯลฯ</p>
<button data-a=cls style="width:100%;margin-top:10px">เข้าใจแล้ว ลุย!</button></div>`;

/* ================= handlers ================= */
const H={create:()=>enter('',1),join:()=>enter($('#rc').value),
 cl:()=>cp(location.href.split('?')[0]+'?room='+code,'คัดลอกลิงก์เชิญแล้ว'),cc:()=>cp(code,'คัดลอกรหัสห้องแล้ว'),
 help:()=>{const p=$('#pop');p.innerHTML=HELP;p.style.display='grid'},cls:()=>$('#pop').style.display='none',
 snd:()=>{SND=!SND;localStorage.adr_snd=SND?'1':'0';if(SND)sfx.pick();render()},
 rdy:()=>set(rf('players/'+me+'/isReady'),!R.players[me].isReady),start,
 addbot:()=>act(r=>{const ids=Object.keys(r.players);if(ids.length>=8)return false;
  const used=ids.map(i=>r.players[i].name),n=BOTN.find(b=>!used.includes(b))||('บอท'+rn(99));
  r.players['bot_'+rid(6)]={name:n,isBot:true,isReady:true,isOnline:true,coins:0,stealUsed:false,stolen:0,joined:Date.now()}}),
 rmbot:d=>set(rf('players/'+d.id),null),
 leave:()=>{if(R&&R.meta.phase=='lobby')set(rf('players/'+me),null);leave()},
 sel:d=>{sel=d.id;sfx.tick();pickUI()},bn:()=>sel&&set(rf('players/'+me+'/ban'),sel),
 stm:()=>{stl=!stl;pickUI()},
 pick:()=>{const s=sel;sel=null;act(r=>take(r,me,s)).then(x=>x&&!x.committed&&toast('เลือกไม่สำเร็จ ลองใหม่อีกครั้ง'))},
 stt:d=>{stl=false;act(r=>steal(r,me,d.id))},
 buy:d=>act(r=>buy(r,me,d.id,d.k)).then(()=>sfx.pick()),
 cap:d=>act(r=>{if(r.meta.phase!='shop'||!T(r.players[me]).includes(d.id))return false;r.players[me].captain=d.id}),
 mv:d=>act(r=>{if(r.meta.phase!='shop')return false;const t=T(r.players[me]),i=t.indexOf(d.id),j=i+(+d.d);
  if(i<0||j<0||j>=t.length)return false;[t[i],t[j]]=[t[j],t[i]];r.players[me].team=t}),
 ch:d=>{push(rf('hype'),{to:d.to,e:d.e,t:sv(),by:me});sfx.pick()},
 emo:d=>{push(rf('hype'),{e:d.e,t:sv(),by:me});$('#emo').style.display='none'},
 fab:()=>{const e=$('#emo');e.style.display=e.style.display=='flex'?'none':'flex'},
 skip:()=>{skip=1;const e=$('#bl');if(e)e.dataset.k='';bl()},
 share:()=>{const rs=R.results||{},P=R.players,ids=Object.keys(P).sort((a,b)=>(rs[b]?.w||0)-(rs[a]?.w||0));
  cp('🏆 Anime Draft Royale\n'+ids.map((id,i)=>`${i+1}. ${P[id].name} — ชนะ ${rs[id]?.w||0} · ดาเมจ ${rs[id]?.sc||0}`).join('\n'),'คัดลอกผลแล้ว')},
 again:()=>act(r=>{if(r.meta.hostId!=me)return false;
  Object.assign(r,{pool:null,banned:null,battleLog:null,results:null,hype:null,chaosCard:null,stealFx:null,lastPick:null});
  Object.values(r.players).forEach(p=>{p.team=null;p.bonus=null;p.coins=0;p.stealUsed=false;p.stolen=0;p.isReady=!!p.isBot;p.ban=null;p.captain=null});
  Object.assign(r.meta,{phase:'lobby',round:0,idx:0,turnEndsAt:0,rev:0})})};

$('#fab').onclick=H.fab;
$('#emo').innerHTML=['🔥','😂','😱','👏','💀','🎉'].map(e=>`<button class=g data-a=emo data-e="${e}">${e}</button>`).join('');
$('#pop').addEventListener('click',e=>{if(e.target.id=='pop')$('#pop').style.display='none'});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(t&&H[t.dataset.a])H[t.dataset.a](t.dataset)});
document.addEventListener('input',ev=>{const t=ev.target,i=t.id;
 if(i=='nm')nm=t.value;else if(i=='q'){F.q=t.value;grid()}else if(i=='fe'){F.el=t.value;grid()}
 else if(i=='fr'){F.ro=t.value;grid()}else if(i=='fa'){F.ra=t.value;grid()}else if(i=='fs'){F.so=t.value;grid()}
 else if(i=='sr')act(r=>{r.meta.rounds=+t.value});else if(i=='st2')act(r=>{r.meta.team=+t.value});else if(i=='sd')act(r=>{r.meta.dtime=+t.value})});
setInterval(()=>{if(!R)return;
 document.querySelectorAll('[data-end]').forEach(x=>{const s=Math.max(0,Math.ceil((+x.dataset.end-sv())/1000));
  if(x.dataset.bar===undefined&&x.tagName!='I')x.textContent=s+' วิ';
  if(x.dataset.beep&&s<=5&&s>0&&x.dataset.last!=s){x.dataset.last=s;sfx.tick()}});
 document.querySelectorAll('[data-bar]').forEach(x=>{const d=+x.dataset.dur||1,l=Math.max(0,+x.dataset.end-sv());x.style.width=Math.min(100,l/d*100)+'%'});
 bl();tick()},500);
render();
const q0=new URLSearchParams(location.search).get('room')||localStorage.adr_room;if(q0&&nm)enter(q0);
</script></body></html>
